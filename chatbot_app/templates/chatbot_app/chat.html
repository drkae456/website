{% load static %}

<div id="chat-popup" class="hidden">
    <div class="chat-header">
        <span>🤖 Hardie Hat - Digital Assistant</span>
        <div>
            <button id="chatCloseButton">✖</button>
        </div>
    </div>
    <div class="chat-body">
        <div class="connection-status connecting" id="connection-status">
            Connecting to Hardie Hat...
        </div>
        <div class="chat-box" id="chat-box">
            <!-- Initial message will be added by JavaScript -->
        </div>
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-button" class="chat-button">Send</button>
        </div>
    </div>
</div>

<script>
  // Add initial message and suggestions
  function initializeChat() {
    addMessage("Hello! Welcome to Hardhat Enterprises. My name is Hardie Hat I am here to help you explore the world of Hardhat Enterprises.");
    addSuggestedQuestions();
  }

  // Initialize chat when loaded
  initializeChat();
</script>
